<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Calculator</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #101820, #1d3557);
        color: white;
    }

    .calculator {
        width: min(92%, 500px);
        padding: 30px;
        border-radius: 22px;
        background: rgba(255,255,255,0.10);
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        text-align: center;
    }

    h1 {
        margin-top: 0;
        font-size: 38px;
    }

    .subtitle {
        opacity: 0.8;
        margin-bottom: 25px;
    }

    input {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 12px;
        font-size: 20px;
        outline: none;
        margin-bottom: 14px;
    }

    button {
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        margin: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: translateY(-2px);
    }

    .calculate {
        width: 90%;
        font-size: 19px;
        font-weight: bold;
    }

    .voice {
        font-size: 18px;
    }

    .result {
        margin-top: 25px;
        padding: 20px;
        border-radius: 15px;
        background: rgba(0,0,0,0.25);
        min-height: 80px;
    }

    #answer {
        font-size: 30px;
        font-weight: bold;
        margin: 8px 0;
    }

    #status {
        opacity: 0.8;
        min-height: 24px;
    }

    .examples {
        margin-top: 22px;
        font-size: 14px;
        line-height: 1.7;
        opacity: 0.8;
    }
</style>
</head>

<body>

<div class="calculator">
    <h1>VOICE CALCULATOR</h1>
    <div class="subtitle">Based on your Python calculator</div>

    <input id="expression"
           type="text"
           placeholder="Example: 25 plus 5">

    <div>
        <button class="voice" onclick="voiceInput()">🎤 Speak</button>
        <button onclick="clearInput()">Clear</button>
    </div>

    <button class="calculate" onclick="calculator()">Calculate</button>

    <div class="result">
        <div id="status">Ready</div>
        <div id="answer">Answer will appear here</div>
    </div>

    <div class="examples">
        Try speaking or typing:<br>
        <b>25 plus 5</b> &nbsp; | &nbsp;
        <b>20 minus 8</b> &nbsp; | &nbsp;
        <b>6 multiply 7</b><br>
        <b>20 divided by 4</b> &nbsp; | &nbsp;
        <b>2 power 5</b>
    </div>
</div>

<script>
// Equivalent to your Python functions

function add(a, b) {
    return a + b;
}

function sub(a, b) {
    return a - b;
}

function multiply(a, b) {
    return a * b;
}

function divide(a, b) {
    return a / b;
}

function sqrt(a) {
    return a ** (1 / 2);
}

function cbrt(a) {
    return a ** (1 / 3);
}

function power(a, b) {
    return a ** b;
}


// Equivalent to your Python operations dictionary

const operations = {
    "+": add,
    "-": sub,
    "*": multiply,
    "/": divide,
    "**": power
};


// Equivalent to your speak() function using browser speech

function speak(text) {
    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();

        const voice = new SpeechSynthesisUtterance(text);
        voice.rate = 0.9;
        voice.volume = 1.0;

        window.speechSynthesis.speak(voice);
    }
}


// Convert voice words into calculator operators

function convertText(text) {

    text = text.toLowerCase();

    text = text.replace(/\bplus\b/g, " + ");
    text = text.replace(/\badd\b/g, " + ");

    text = text.replace(/\bminus\b/g, " - ");
    text = text.replace(/\bsubtract\b/g, " - ");

    text = text.replace(/\bmultiply\b/g, " * ");
    text = text.replace(/\btimes\b/g, " * ");
    text = text.replace(/\binto\b/g, " * ");

    text = text.replace(/\bdivided by\b/g, " / ");
    text = text.replace(/\bdivide\b/g, " / ");
    text = text.replace(/\bby\b/g, " / ");

    text = text.replace(/\bpower of\b/g, " ** ");
    text = text.replace(/\bpower\b/g, " ** ");

    // Allow common spoken decimal wording
    text = text.replace(/\bpoint\b/g, ".");

    return text;
}


// Equivalent to your calculator() function

function calculator() {

    let text = document.getElementById("expression").value.trim();

    if (text === "") {
        document.getElementById("status").textContent =
            "Please enter or speak a calculation.";

        speak("Please enter or speak a calculation.");
        return;
    }

    text = convertText(text);

    // Similar to your Python regular expression
    const match = text.match(
        /(-?\d+(?:\.\d+)?)\s*(\*\*|[+\-*/])\s*(-?\d+(?:\.\d+)?)/
    );

    if (!match) {

        document.getElementById("status").textContent =
            "Operation is not valid. Please check once.";

        document.getElementById("answer").textContent = "Invalid operation";

        speak("Your operation is not valid. Please check once.");
        return;
    }

    const n1 = Number(match[1]);
    const operation = match[2];
    const n2 = Number(match[3]);

    if (operation === "/" && n2 === 0) {
        document.getElementById("status").textContent =
            "Cannot divide by zero.";

        document.getElementById("answer").textContent = "Error";

        speak("Cannot divide by zero.");
        return;
    }

    const answer = operations[operation](n1, n2);

    document.getElementById("status").textContent =
        `${n1} ${operation} ${n2}`;

    document.getElementById("answer").textContent =
        answer;

    speak(`The answer is ${answer}`);
}


// Voice input
// This replaces sounddevice + speech_recognition for the website.

function voiceInput() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        document.getElementById("status").textContent =
            "Voice recognition is not supported in this browser.";

        speak("Voice recognition is not supported in this browser.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    document.getElementById("status").textContent =
        "Listening...";

    speak("Speak your calculation");

    // Give the browser a moment to start speaking
    setTimeout(() => {
        recognition.start();
    }, 700);

    recognition.onresult = function(event) {

        const text = event.results[0][0].transcript;

        document.getElementById("expression").value = text;

        document.getElementById("status").textContent =
            "You said: " + text;

        calculator();
    };

    recognition.onerror = function(event) {

        document.getElementById("status").textContent =
            "Could not understand: " + event.error;

        speak("Could not understand.");
    };

    recognition.onend = function() {

        // Only update if no result has already been displayed
        if (document.getElementById("status").textContent === "Listening...") {
            document.getElementById("status").textContent =
                "Recording finished.";
        }
    };
}


function clearInput() {

    document.getElementById("expression").value = "";

    document.getElementById("status").textContent =
        "Ready";

    document.getElementById("answer").textContent =
        "Answer will appear here";

    window.speechSynthesis.cancel();
}


// Press Enter to calculate
document.getElementById("expression").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        calculator();
    }
});
</script>

</body>
</html>
